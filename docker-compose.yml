services:
  db:
    image: postgres:16
    container_name: cert_db
    environment:
      POSTGRES_USER: cert
      POSTGRES_PASSWORD: cert
      POSTGRES_DB: certdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cert -d certdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cert_web
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cert:cert@db:5433/certdb?schema=public
      # Для демо-админки позже:
      ADMIN_PASSWORD: "change-me"
      NEXT_PUBLIC_BASE_URL: "http://localhost:3001"
    ports:
      - "3001:3000"
    volumes:
      - ./web:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
  node_modules:
